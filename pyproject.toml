[project]
name = "notion-benchmarking"
version = "0.1.0"
description = "LaminDB load and lakehouse benchmarks"
requires-python = ">=3.13,<3.14"
dependencies = [
    # The local checkout publishes lamindb-core; [full] supplies the same
    # dependencies as the downloaded lamindb convenience package.
    "lamindb-core[full]",
    "lamindb-setup[aws]",
    "lamin-cli",
    "lamin-utils",
    "bionty",
    "pertdb",
    "matplotlib>=3.8",
    "numpy",
    "pandas>=3.0",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=15.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
lakehouse = [
    "boto3>=1.34.0",
    "duckdb>=0.10.0",
    "lancedb",
    "polars",
    "pyiceberg[pyarrow,sql-sqlite]>=0.7.0",
    "pysam",
    "seaborn>=0.13.0",
    "torch>=2.0.0",
    "tqdm>=4.0.0",
]

[dependency-groups]
dev = ["ruff>=0.16"]

[tool.uv]
# This repository contains runnable scripts and notebooks, not a Python package.
package = false

[tool.uv.sources]
lamindb-core = { path = "../../laminlabs/lamindb", editable = true }
lamindb-setup = { path = "../../laminlabs/lamindb/sub/lamindb-setup", editable = true }
lamin-cli = { path = "../../laminlabs/lamindb/sub/lamin-cli", editable = true }
lamin-utils = { path = "../../laminlabs/lamin-utils", editable = true }
bionty = { path = "../../laminlabs/lamindb/sub/bionty", editable = true }
pertdb = { path = "../../laminlabs/lamindb/sub/pertdb", editable = true }
